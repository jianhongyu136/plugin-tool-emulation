name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            extension: so
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            extension: so
          - os: windows-latest
            goos: windows
            goarch: amd64
            extension: dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Windows GCC
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Select Windows GCC
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\msys64\ucrt64\bin' >> "$GITHUB_PATH"
      - name: Check configuration page JavaScript
        shell: bash
        run: node --check web/config.js
      - name: Test JSON ABI without CGO
        shell: bash
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: Vet and race test native ABI
        shell: bash
        run: |
          CGO_ENABLED=1 go vet ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
      - name: Build library with Git version
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version=dev; fi
          go build -trimpath -buildmode=c-shared \
            -ldflags="-s -w -X main.pluginVersion=${version}" \
            -o "dist/tool-emulation-${GOOS}-${GOARCH}.${{ matrix.extension }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: tool-emulation-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/tool-emulation-*.${{ matrix.extension }}
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tool-emulation-*.${{ matrix.extension }}
          generate_release_notes: true
